name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

env:
  PROJECT: sandbox-day3
  REGION: northamerica-northeast2
  REPO: firewatch
  BUCKET: sandbox-day3-firewatch-raw
  RUNTIME_SA: firewatch-ingest@sandbox-day3.iam.gserviceaccount.com
  WIF_PROVIDER: projects/863281111819/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER_SA: firewatch-deployer@sandbox-day3.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Compute image tags
        id: meta
        run: |
          TAG="${GITHUB_SHA::7}"
          INGEST_IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/firewatch-ingest:${TAG}"
          WEB_IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/firewatch-web:${TAG}"
          echo "tag=${TAG}"                  >> "$GITHUB_OUTPUT"
          echo "ingest_image=${INGEST_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "web_image=${WEB_IMAGE}"      >> "$GITHUB_OUTPUT"
          echo "Ingest: ${INGEST_IMAGE}"
          echo "Web:    ${WEB_IMAGE}"

      - name: Build & push ingest image
        run: |
          gcloud builds submit \
            --tag "${{ steps.meta.outputs.ingest_image }}" \
            --project "${PROJECT}" \
            --gcs-log-dir "gs://${BUCKET}/_cloudbuild-logs"

      - name: Build & push web image
        run: |
          gcloud builds submit web \
            --tag "${{ steps.meta.outputs.web_image }}" \
            --project "${PROJECT}" \
            --gcs-log-dir "gs://${BUCKET}/_cloudbuild-logs"

      - name: Deploy ingest Cloud Run Jobs
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.ingest_image }}"

          deploy_job() {
            local source="$1"
            local job_name="firewatch-${source//_/-}"
            local secrets_args=()
            if [[ "$source" == "firms_canada" ]]; then
              secrets_args=("--set-secrets" "FIRMS_MAP_KEY=firms-map-key:latest")
            fi
            echo "::group::Deploying ${job_name}"
            gcloud run jobs deploy "${job_name}" \
              --image "${IMAGE}" \
              --region "${REGION}" --project "${PROJECT}" \
              --service-account "${RUNTIME_SA}" \
              --args "${source}" \
              --max-retries 2 \
              --task-timeout 600s \
              --set-env-vars "GCP_PROJECT=${PROJECT},GCS_BUCKET=${BUCKET}" \
              "${secrets_args[@]}"
            echo "::endgroup::"
          }

          deploy_job cwfis_hotspots
          deploy_job cwfis_perimeters
          deploy_job firms_canada
          deploy_job noaa_hms_smoke

      - name: Deploy web Cloud Run Service
        id: web
        run: |
          gcloud run deploy firewatch-web \
            --image "${{ steps.meta.outputs.web_image }}" \
            --region "${REGION}" --project "${PROJECT}" \
            --service-account "${RUNTIME_SA}" \
            --allow-unauthenticated \
            --cpu 1 --memory 512Mi \
            --concurrency 80 \
            --min-instances 0 --max-instances 3 \
            --set-env-vars "GCS_BUCKET=${BUCKET}"
          URL=$(gcloud run services describe firewatch-web \
            --region "${REGION}" --project "${PROJECT}" \
            --format="value(status.url)")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### 🔥 FireWatch deployed"
            echo ""
            echo "**Dashboard:** ${{ steps.web.outputs.url }}"
            echo ""
            echo "**Ingest image:** \`${{ steps.meta.outputs.ingest_image }}\`"
            echo "**Web image:** \`${{ steps.meta.outputs.web_image }}\`"
            echo ""
            echo "**Updated jobs:** firewatch-cwfis-hotspots, firewatch-cwfis-perimeters, firewatch-firms-canada, firewatch-noaa-hms-smoke"
          } >> "$GITHUB_STEP_SUMMARY"
