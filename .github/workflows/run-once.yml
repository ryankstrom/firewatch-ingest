name: Run ingest job once

# Manually trigger a single Cloud Run Job execution from GitHub —
# useful for backfills or testing without waiting for Cloud Scheduler.

on:
  workflow_dispatch:
    inputs:
      source:
        description: Which source to run
        required: true
        type: choice
        options:
          - cwfis_hotspots
          - cwfis_perimeters
          - firms_canada
          - noaa_hms_smoke

permissions:
  contents: read
  id-token: write

env:
  PROJECT: sandbox-day3
  REGION: northamerica-northeast2
  WIF_PROVIDER: projects/863281111819/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER_SA: firewatch-deployer@sandbox-day3.iam.gserviceaccount.com

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute job
        run: |
          job_name="firewatch-${INPUT_SOURCE//_/-}"
          gcloud run jobs execute "${job_name}" \
            --region "${REGION}" --project "${PROJECT}" --wait
        env:
          INPUT_SOURCE: ${{ inputs.source }}
